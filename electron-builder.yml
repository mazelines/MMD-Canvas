appId: com.mazelines.mmdcanvas
productName: MMD Canvas
directories:
  output: dist
artifactName: MMD-Canvas-${version}-${os}-${arch}.${ext}
asar: true
afterPack: ./tests/verify-package.cjs
fileAssociations:
  - ext: canvas
    name: MMD Canvas Workspace
    description: MMD Canvas conversion workspace
    role: Editor
npmRebuild: false
files:
  - electron/**/*
  - renderer/**/*
  - src/**/*
  - cli.js
  - package.json
  - LICENSE
  - licenses/**/*
  - '!node_modules/three/build/three.module*'
  - '!node_modules/three/build/three.webgpu*'
  - '!node_modules/three/build/three.tsl*'
  - '!node_modules/three/src/renderers/webgl/**/*'
  - '!node_modules/three/src/renderers/WebGLRenderer.js'
  # These are runtime modules, despite Three.js placing them under "examples".
  # An explicit FileSet bypasses the dependency copier's examples exclusion.
  - from: node_modules/three/examples/jsm
    to: node_modules/three/examples/jsm
    filter:
      - '**/*'
# Sample workspace opened on the first launch. Kept outside app.asar, next to the executable
# so the model and its textures stay ordinary files.
extraFiles:
  - from: Example
    to: Example
    filter:
      - '**/*'
  - from: out/dx12
    to: native/dx12
    filter:
      - '*.exe'
      - '*.cso'
      - '*.bin'
win:
  target: nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
publish: null
